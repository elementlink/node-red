name: Build and Deploy

on:
  push:
    branches:
      - master
      - release
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================
  # Call Parent Workflow
  # ============================================
  ci-cd:
    uses: elementlink/ci-cd-workflows/.github/workflows/ci-cd-parent.yml@main
    with:
      app-name: 'iic-dae-ai-nodered'              # ← 修改为您的应用名
      # 以下为可选配置：
      # dockerfile-path: '.'                 # Dockerfile 路径，默认根目录
      deployment-name: 'iic-dae-ai-nodered'                  # K8s Deployment 名称，默认同 app-name
      container-name: 'iic-dae-ai-nodered'                   # 容器名称，默认同 app-name
      # dev-version-prefix: 'dev'            # dev 版本前缀，默认 'dev'
      # release-version-prefix: 'v'          # release 版本前缀，默认 'v'
    secrets: inherit
